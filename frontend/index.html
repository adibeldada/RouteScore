<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteScore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>RouteScore</h1>
  <p>How reliable are Hamilton's buses?</p>

  <!-- All of Hamilton: filled by app.js from /home -->
  <section id="system">Loading...</section>

  <!-- Leaderboard: filled by app.js from /leaderboard -->
  <h2>Routes, most to least reliable</h2>
  <table>
    <thead>                                  <!-- header row -->
      <tr>
        <th>#</th>
        <th>Route</th>
        <th>On time</th>
        <th>Late</th>
        <th>Early</th>
        <th>Arrivals</th>
      </tr>
    </thead>
    <tbody id="leaderboard">                 <!-- app.js puts one <tr> per route here -->
      <tr><td colspan="6">Loading...</td></tr>
    </tbody>
  </table>

  <!-- Route by hour: dropdown filled from /leaderboard, hours filled from /routes/<id> -->
  <h2>Route by hour</h2>
  <select id="route-picker">
    <option value="">Pick a route</option>   <!-- placeholder option -->
  </select>

  <section id="route-overall"></section>      <!-- overall numbers for the picked route -->

  <table>
    <thead>
      <tr><th>Hour</th><th>On time</th><th>Late</th><th>Early</th><th>Arrivals</th></tr>
    </thead>
    <tbody id="route-hours"></tbody>          <!-- JS fills the hour rows here -->
  </table>

  <script src="app.js"></script>             <!-- last, so the elements above exist first -->

  <!-- Stop lookup: filled by app.js -->
  <h2>How reliable is my stop?</h2>
  <input id="stop-input" list="stop-list" placeholder="Type a stop name...">
    <option value=""></option>    <!-- placeholder option -->
  </select>


</body>
</html>
